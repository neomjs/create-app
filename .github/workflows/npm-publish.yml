name: Publish Package to npmjs
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    concurrency:
      group: npm-publish-main
      cancel-in-progress: false
    # npm Trusted Publishing (OIDC): id-token mints the per-run credential; no NODE_AUTH_TOKEN.
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v6
      # Setup .npmrc file to publish to npm
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - run: npm ci --ignore-scripts
      - name: Publish if version is not on npm
        run: |
          version="$(jq -r .version package.json)"
          if npm view "neo-app@${version}" version >/dev/null 2>&1; then
            echo "neo-app@${version} is already on npm; skipping publish."
          else
            npm publish
          fi
      # `npm create neo-app` resolves to the package create-neo-app: the same files under a second
      # name. The manifest is renamed in the runner only; nothing is committed.
      - name: Publish the create-neo-app name if its version is not on npm
        run: |
          version="$(jq -r .version package.json)"
          if npm view "create-neo-app@${version}" version >/dev/null 2>&1; then
            echo "create-neo-app@${version} is already on npm; skipping publish."
          else
            npm pkg set name=create-neo-app
            npm pkg delete bin
            npm pkg set bin.create-neo-app=./tasks/neo-app.mjs
            npm publish
          fi
