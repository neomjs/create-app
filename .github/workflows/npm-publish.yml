name: Publish Package to npmjs
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # npm Trusted Publishing (OIDC): id-token mints the per-run credential; no NODE_AUTH_TOKEN.
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v6
      # Setup .npmrc file to publish to npm
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - run: npm ci
      - name: Publish if version is not on npm
        run: |
          version="$(jq -r .version package.json)"
          if npm view "neo-app@${version}" version >/dev/null 2>&1; then
            echo "neo-app@${version} is already on npm; skipping publish."
          else
            npm publish
          fi
