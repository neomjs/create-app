name: First-run timing

# A measurement for neomjs/create-app#71. It lives on its branch only and runs when that branch is pushed;
# nothing here merges to main. The receipt is the run and its log.
on:
  push:
    branches: [mnemosyne/71-first-run-timing]

permissions:
  contents: read

jobs:
  time:
    name: ${{ matrix.arm }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        # Run 44227540176 holds the plain arms of the baseline; this push repeats only the arm whose shaping failed there
        include:
          - arm: ubuntu-shaped
            os: ubuntu-latest
            rate: 10mbit
            delay: 50ms
    defaults:
      run:
        shell: bash
    env:
      GENERATOR: neo-app@13.4.1
      RUNS: '3'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      # Outside the clock and before any shaping: the browser is the instrument, not the run
      - name: Headless browser
        run: |
          mkdir -p "$RUNNER_TEMP/pw"
          cd "$RUNNER_TEMP/pw"
          npm init -y > /dev/null
          npm install playwright@1.65.1 > /dev/null
          npx playwright install --with-deps chromium

      # Each direction gets the delay, so the round trip is twice it. Incoming traffic is shaped through ifb0.
      - name: Shape the link
        if: matrix.rate != ''
        run: |
          set -euxo pipefail
          DEV=$(ip route get 1.1.1.1 | awk '{for (i = 1; i <= NF; i++) if ($i == "dev") print $(i + 1)}')
          URL=https://registry.npmjs.org/neo.mjs/-/neo.mjs-13.4.0.tgz
          probe() { curl -s -o /dev/null --max-time 8 -w '%{speed_download} %{time_connect}' "$URL" || true; }
          echo "control, before shaping (B/s, connect s): $(probe)"
          tc qdisc show dev "$DEV"
          tc filter show dev "$DEV" ingress || true
          sudo modprobe sch_netem || { sudo apt-get update -qq; sudo apt-get install -y -qq "linux-modules-extra-$(uname -r)"; sudo modprobe sch_netem; }
          sudo modprobe ifb numifbs=1
          sudo modprobe act_mirred || true
          sudo modprobe cls_matchall || true
          sudo ip link set dev ifb0 up
          sudo tc qdisc replace dev "$DEV" root netem delay ${{ matrix.delay }} rate ${{ matrix.rate }}
          # The image already carries an ingress hook on this device and refuses a second one, so the filter joins it
          sudo tc qdisc add dev "$DEV" clsact 2> /dev/null || true
          sudo tc filter add dev "$DEV" ingress protocol all prio 1 matchall action mirred egress redirect dev ifb0
          sudo tc qdisc replace dev ifb0 root netem delay ${{ matrix.delay }} rate ${{ matrix.rate }}
          tc qdisc show
          tc filter show dev "$DEV" ingress
          AFTER=$(probe)
          echo "after shaping (B/s, connect s): $AFTER"
          # An arm that is not shaped reports nothing: 10 Mbit/s is 1.25 MB/s, so twice that fails the step
          echo "$AFTER" | awk '{ exit ($1 > 2500000) ? 1 : 0 }'

      - name: Three first runs
        run: |
          SHAPING="none"
          if [ -n "${{ matrix.rate }}" ]; then SHAPING="${{ matrix.rate }} and ${{ matrix.delay }} in each direction (tc netem, incoming through ifb0)"; fi
          node scripts/first-run/arm.mjs "${{ matrix.arm }}" "$RUNS" "$GENERATOR" "$RUNNER_TEMP/pw" "$RUNNER_TEMP/out" "$SHAPING"

      - name: The first run's stamped generator log
        if: always()
        run: cat "$RUNNER_TEMP/out/generator-1.log" || true

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: first-run-${{ matrix.arm }}
          path: ${{ runner.temp }}/out
