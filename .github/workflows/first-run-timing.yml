name: First-run timing

# A measurement for neomjs/create-app#71. It lives on its branch only and runs when that branch is pushed;
# nothing here merges to main. The receipt is the run and its log.
on:
  push:
    branches: [mnemosyne/71-first-run-timing]

permissions:
  contents: read

jobs:
  time:
    name: ${{ matrix.arm }}, ${{ matrix.path }}, ${{ matrix.variant }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        # published: the generator a stranger gets from npm today. main: the 14.0 path, packed from this repository's main.
        # fileserver: the generator and the engine that carry the engine's own file server, each packed from the ref
        # named in env below (the two open pull requests until they merge, then main and dev).
        # The table so far is `path: [published, main]` and `arm: [ubuntu-plain, ubuntu-shaped, windows-plain]` (runs
        # 44231048865 and 44233652087). This push runs the third path on Linux alone: the question is the release
        # candidate's number against ten seconds, and the Windows rows of 44383710739 stand.
        path: [fileserver]
        arm: [ubuntu-plain]
        # An include entry whose arm is not in the list above would start a job of its own, so the shaped entry waits
        # here as a comment. A packed engine is read from disk, so a shaped run of this path would not download it:
        #   - {arm: ubuntu-shaped, os: ubuntu-latest, rate: 10mbit, delay: 50ms}
        # What the scaffold installs (scripts/first-run/lean-variant.mjs): the candidate as it is, without the nested
        # install, with one list split along npm's two groups and the first install run as `npm i --omit=dev`, and
        # with the first-run packages alone.
        # On the branch of #80 the scaffold is already lean: `control` is that branch as it stands, `no-nested` adds
        # the one postinstall line it holds back for #68. The other two variants rewrite a list that branch no longer has.
        variant: [control, no-nested]
        include:
          - arm: ubuntu-plain
            os: ubuntu-latest
    defaults:
      run:
        shell: bash
    env:
      GENERATOR: neo-app@13.4.1
      RUNS: '3'
      # The third path's two sources: the engine's dev, and the branch of #80, which is stacked on the generator of
      # the open 14.0.0 pull request (#78).
      ENGINE_SOURCE_REF: dev
      GENERATOR_SOURCE_REF: refs/heads/mnemosyne/80-first-run-install
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      # Outside the clock and before any shaping: the browser is the instrument, not the run
      - name: Headless browser
        run: |
          mkdir -p "$RUNNER_TEMP/pw"
          cd "$RUNNER_TEMP/pw"
          npm init -y > /dev/null
          npm install playwright@1.65.1 > /dev/null
          npx playwright install --with-deps chromium

      # The third path's engine is not on npm either. `prepare` would install that repository's git hooks, and `prepack`
      # only folds .gitignore into .npmignore; a fresh checkout holds no ignored file, so the pack skips both.
      - name: The engine, packed
        if: matrix.path == 'fileserver'
        run: |
          ENG="$RUNNER_TEMP/engine"
          if command -v cygpath > /dev/null; then ENG=$(cygpath -u "$ENG"); fi
          git init -q "$ENG"
          cd "$ENG"
          git config core.longpaths true
          git remote add origin https://github.com/neomjs/neo.git
          git fetch -q --depth 1 origin "$ENGINE_SOURCE_REF"
          git checkout -q FETCH_HEAD
          SHA=$(git rev-parse --short FETCH_HEAD)
          TARBALL=$(npm pack --ignore-scripts --silent | tail -1)
          echo "ENGINE_TARBALL=$RUNNER_TEMP/engine/$TARBALL" >> "$GITHUB_ENV"
          echo "ENGINE_LABEL=neo.mjs from $ENGINE_SOURCE_REF@$SHA, packed" >> "$GITHUB_ENV"

      # A generator that is not on npm is packed, and its tarball stands in for the registry copy; its dependencies
      # still come from the registry. On the third path the workspace it writes installs the packed engine.
      - name: The generator, packed
        if: matrix.path != 'published'
        run: |
          REF=main
          if [ "${{ matrix.path }}" = fileserver ]; then REF="$GENERATOR_SOURCE_REF"; fi
          git fetch --depth 1 origin "$REF"
          # tar reads a drive letter as a host name, so Git Bash on Windows gets the path in its own form
          GEN="$RUNNER_TEMP/gen"
          if command -v cygpath > /dev/null; then GEN=$(cygpath -u "$GEN"); fi
          mkdir -p "$GEN"
          git archive FETCH_HEAD | tar -x -C "$GEN"
          SHA=$(git rev-parse --short FETCH_HEAD)
          cd "$GEN"
          if [ -n "${ENGINE_TARBALL:-}" ]; then
            node "$GITHUB_WORKSPACE/scripts/first-run/point-engine.mjs" tasks/createPackageJson.mjs "$ENGINE_TARBALL"
          fi
          node "$GITHUB_WORKSPACE/scripts/first-run/lean-variant.mjs" . "${{ matrix.variant }}"
          TARBALL=$(npm pack --silent | tail -1)
          echo "GENERATOR=$RUNNER_TEMP/gen/$TARBALL" >> "$GITHUB_ENV"
          echo "GENERATOR_REF=neo-app from $REF@$SHA, packed, variant ${{ matrix.variant }}${ENGINE_LABEL:+; $ENGINE_LABEL}" >> "$GITHUB_ENV"

      # The runs of this arm happen in a network namespace of their own, behind a veth pair. Each end delays and limits
      # what it sends, so the round trip is twice the delay. The image's own hooks on its uplink stay untouched: its
      # ingress hook is taken by a filter of the image (runs 44227540176 and 44230236374).
      - name: Shape the link
        if: matrix.rate
        run: |
          set -euxo pipefail
          DEV=$(ip route get 1.1.1.1 | awk '{for (i = 1; i <= NF; i++) if ($i == "dev") print $(i + 1)}')
          URL=https://registry.npmjs.org/neo.mjs/-/neo.mjs-13.4.0.tgz
          probe() { "$@" curl -s -o /dev/null --max-time 8 -w '%{speed_download} %{time_connect}' "$URL" || true; }
          echo "control, the runner's own link (B/s, connect s): $(probe)"
          sudo modprobe sch_netem || { sudo apt-get update -qq; sudo apt-get install -y -qq "linux-modules-extra-$(uname -r)"; sudo modprobe sch_netem; }
          sudo ip netns add shaped
          sudo ip link add veth-host type veth peer name veth-ns
          sudo ip link set veth-ns netns shaped
          sudo ip addr add 10.200.0.1/24 dev veth-host
          sudo ip link set veth-host up
          sudo ip netns exec shaped ip addr add 10.200.0.2/24 dev veth-ns
          sudo ip netns exec shaped ip link set veth-ns up
          sudo ip netns exec shaped ip link set lo up
          sudo ip netns exec shaped ip route add default via 10.200.0.1
          sudo sysctl -q -w net.ipv4.ip_forward=1
          sudo iptables -t nat -A POSTROUTING -s 10.200.0.0/24 -o "$DEV" -j MASQUERADE
          sudo iptables -I FORWARD -i veth-host -j ACCEPT
          sudo iptables -I FORWARD -o veth-host -j ACCEPT
          sudo mkdir -p /etc/netns/shaped
          grep -E '^nameserver' /run/systemd/resolve/resolv.conf | sudo tee /etc/netns/shaped/resolv.conf
          echo "control, the namespace before shaping (B/s, connect s): $(probe sudo ip netns exec shaped)"
          sudo tc qdisc add dev veth-host root netem delay ${{ matrix.delay }} rate ${{ matrix.rate }}
          sudo ip netns exec shaped tc qdisc add dev veth-ns root netem delay ${{ matrix.delay }} rate ${{ matrix.rate }}
          AFTER=$(probe sudo ip netns exec shaped)
          echo "the namespace after shaping (B/s, connect s): $AFTER"
          # An arm that is not shaped reports nothing: 10 Mbit/s is 1.25 MB/s, so a read above twice that, or no read, fails
          echo "$AFTER" | awk '{ exit ($1 > 2500000 || $1 + 0 == 0) ? 1 : 0 }'

      - name: Three first runs
        run: |
          # The generator starts `npm i` itself; npm reads this as --omit=dev
          if [ "${{ matrix.variant }}" = omit-dev ]; then export npm_config_omit=dev; fi
          RUN=(node scripts/first-run/arm.mjs "${{ matrix.arm }}, ${{ matrix.variant }}" "$RUNS" "$GENERATOR" "$RUNNER_TEMP/pw" "$RUNNER_TEMP/out")
          if [ -n "${{ matrix.rate }}" ]; then
            sudo ip netns exec shaped sudo -u "$(id -un)" env "PATH=$PATH" "HOME=$HOME" "GITHUB_STEP_SUMMARY=$GITHUB_STEP_SUMMARY" "GENERATOR_REF=${GENERATOR_REF:-}" \
              "${RUN[@]}" "${{ matrix.rate }} and ${{ matrix.delay }} in each direction (tc netem on a veth pair; the runs sit in a network namespace)"
          else
            "${RUN[@]}" none
          fi

      - name: The first run's stamped generator log
        if: always()
        run: cat "$RUNNER_TEMP/out/generator-1.log" || true

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: first-run-${{ matrix.arm }}-${{ matrix.path }}-${{ matrix.variant }}
          path: ${{ runner.temp }}/out
