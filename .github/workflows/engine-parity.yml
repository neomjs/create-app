name: Engine parity

# The scaffold's generated devDependencies must match the engine release its `neo.mjs` pin resolves to, read from npm.
# See scripts/check-engine-parity.mjs for the scope and why the engine is never read from a checkout.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Parity check contract
        run: node scripts/test-check-engine-parity.mjs

      - name: Generated devDependencies match the pinned engine release
        run: node scripts/check-engine-parity.mjs
