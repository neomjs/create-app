name: Engine parity

# The scaffold's generated devDependencies and overrides must match the engine release its `neo.mjs` pin resolves to,
# read from npm.
# See scripts/check-engine-parity.mjs for the scope and why the engine is never read from a checkout.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Parity check contract
        run: node scripts/test-check-engine-parity.mjs

      - name: Coding-agent layer contract
        run: node scripts/test-agent-layer.mjs

      - name: create-neo-app forwarder contract
        run: node scripts/test-create-neo-app.mjs

      # The contracts above run with no install; this one runs the generator itself
      - name: Install the generator's dependencies
        run: npm ci --ignore-scripts

      - name: First-run contract
        run: node scripts/test-neo-app.mjs

      # Last, because it reads npm: before a major is published the pin resolves to nothing, and a step that fails
      # skips every step after it
      - name: Generated devDependencies and build tools match the pinned engine release
        run: node scripts/check-engine-parity.mjs
